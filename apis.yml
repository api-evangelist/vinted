name: Vinted
description: 'Vinted is a European consumer-to-consumer (C2C) online marketplace for
  buying and selling secondhand clothes, shoes, accessories, and other lifestyle items,
  operating across web and mobile apps in dozens of markets. Founded in Vilnius, Lithuania,
  it is one of Europe''s largest secondhand fashion platforms and is backed by Accel,
  Insight Partners, and Lightspeed Venture Partners. Vinted does not publish a public
  developer API, SDKs, or a developer portal; this API Evangelist profile captures the
  company''s public identity, legal, and security (security.txt / domain-security) surfaces.'
